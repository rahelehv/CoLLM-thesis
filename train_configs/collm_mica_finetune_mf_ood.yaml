model:
  arch: mini_gpt4rec_mica
  model_type: pretrain_vicuna
  freeze_rec: True
  freeze_proj: False # stage 2: train the CIE/mapping layer (llama_proj) only
  freeze_lora: True # stage 2: keep the stage-1 MiCA adapters frozen (same flag as LoRA)
  use_grad_checkpoint: True
  max_txt_len: 1024
  proj_token_num: 1
  proj_drop: 0
  proj_mid_times: 10
  end_sym: "###"
  prompt_path: "prompts/collm_movie.txt" # stage 2: prompts WITH IDs
  prompt_template: '{}'
  llama_model: "${oc.env:COLLM_LLAMA_DIR}"
  user_num: -100
  item_num: -100
  ans_type: 'v2'
  rec_model: "MF"
  lora_config:
    use_lora: True
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
    dropout: 0.05
    mica: True  # must match Stage 1 so the MiCA architecture is built before ckpt load
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size: 256
    pretrained_path: "${oc.env:COLLM_MF_REC_PTH}"

  ckpt: "${oc.env:COLLM_MICA_STAGE1_CKPT}" # MiCA Stage-1 checkpoint_best.pth (recovered 0.688747 @64)


datasets:
  movie_ood:
    path: "${oc.env:COLLM_ML1M_DIR}"
    data_type: default
    build_info:
      storage: "${oc.env:COLLM_ML1M_DIR}"

run:
  task: rec_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-3
  min_lr: 8e-05
  warmup_lr: 1e-05
  mode: 'v2'
  weight_decay: 1e-3
  max_epoch: 50
  early_stop_epochs: 10 # in EVALUATED epochs (eval_freq=4 -> ~40 real-epoch patience)
  save_ckpt_freq: 20
  eval_freq: 4 # speed/safety: matches Control/CIE-G/X/CIE-R full runs
  save_ckpt_keep: 3
  iters_per_epoch: 50
  batch_size_train: 4
  batch_size_eval: 4
  num_workers: 4
  log_freq: 50
  warmup_steps: 200
  seed: 42
  output_dir: ${oc.env:COLLM_OUTPUT_DIR}/collm-mica-stage2
  amp: True
  resume_ckpt_path: null
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test","valid"]
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
