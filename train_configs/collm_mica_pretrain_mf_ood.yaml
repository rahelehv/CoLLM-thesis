model:
  arch: mini_gpt4rec_mica
  model_type: pretrain_vicuna
  freeze_rec: True
  freeze_proj: True
  freeze_lora: False
  use_grad_checkpoint: True
  max_txt_len: 1024
  proj_token_num: 1
  proj_drop: 0
  proj_mid_times: 10
  end_sym: "###"
  prompt_path: "prompts/tallrec_movie.txt"
  prompt_template: '{}'
  llama_model: "${oc.env:COLLM_LLAMA_DIR}"
  user_num: -100
  item_num: -100
  ans_type: 'v2'
  rec_model: "MF"
  lora_config:
    use_lora: True
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
    dropout: 0.05
    mica: True  # MiCA: B=minor singular vectors (frozen), A=0 (trainable)
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size: 256
    pretrained_path: "not_have"

datasets:
  movie_ood:
    path: "${oc.env:COLLM_ML1M_DIR}"
    data_type: default
    build_info:
      storage: "${oc.env:COLLM_ML1M_DIR}"

run:
  task: rec_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-3
  min_lr: 8e-05
  warmup_lr: 1e-05
  mode: 'v2'
  weight_decay: 1e-3
  max_epoch: 80
  early_stop_epochs: 10
  save_ckpt_freq: 20
  eval_freq: 2
  iters_per_epoch: 50
  batch_size_train: 4
  batch_size_eval: 4
  num_workers: 4
  log_freq: 50
  warmup_steps: 200
  seed: 42
  output_dir: ${oc.env:COLLM_OUTPUT_DIR}/collm-mica-stage1
  amp: True
  resume_ckpt_path: null
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test","valid"]
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
