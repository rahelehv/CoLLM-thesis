model:
  arch: mini_gpt4rec_v2 # by default
  model_type: pretrain_vicuna
  freeze_rec: True  #
  freeze_proj: False # stage 2: train the CIE/mapping layer (llama_proj) only
  freeze_lora: True # stage 2: keep the stage-1 LoRA adapters frozen
  use_grad_checkpoint: True # recompute activations in backward; lets fp16/batch-4 fit on a 16GB T4
  max_txt_len: 1024 # by default
  proj_token_num: 1 # default:1,  the number of text token embeddings that the A single ID embedding is converted into
  proj_drop: 0 # by default
  proj_mid_times: 10 # proj_mid_times * rec embedding size = the middle layer size of the mapping module
  end_sym: "###"
  prompt_path: "prompts/collm_movie.txt" # stage 2: prompts WITH <UserID>/<ItemIDList>/<TargetItemID>
  prompt_template: '{}'
  llama_model: "${oc.env:COLLM_LLAMA_DIR}" #vicuna path
  user_num: -100
  item_num: -100
  ans_type: 'v2' # by default
  rec_model: "MF" #[MF, lightgcn,.....], see "Rec2Base" class in  minigpt4/models/rec_model.py
  lora_config:
    use_lora: True
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"] # default: ["q_proj", "v_proj"]; others? ['lm_head'], ["q_proj", "v_proj",'k_proj','o_proj']
    dropout: 0.05
  rec_config: # recommender model config
    user_num: -100
    item_num: -100
    embedding_size: 256 #embedding size
    pretrained_path: "${oc.env:COLLM_MF_REC_PTH}" # stage-1 Phase-1 MF .pth; must exist or the run raises


  ckpt: "${oc.env:COLLM_STAGE1_CKPT}" # stage-1 LoRA checkpoint (checkpoint_best.pth); loaded with strict=False


datasets:
  movie_ood:
    path: "${oc.env:COLLM_ML1M_DIR}" #data path
    data_type: default
    build_info:
      storage: "${oc.env:COLLM_ML1M_DIR}" # data path

run:
  task: rec_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-3
  min_lr: 8e-5
  warmup_lr: 1e-5
  mode: 'v2' # always, please not change it


  weight_decay: 1e-3 # by default
  max_epoch: 80
  early_stop_epochs: 10 # in EVALUATED epochs (eval_freq=2 -> ~20 real epochs), keeps patience equivalent to before
  save_ckpt_freq: 20 # also save a plain checkpoint every N epochs (for session resume)
  eval_freq: 2 # run validation (1300 batches/epoch, the dominant cost) every N epochs
  iters_per_epoch: 50 #100
  batch_size_train: 4 # 8
  batch_size_eval: 4 # 32
  num_workers: 4
  log_freq: 50
  warmup_steps: 200

  seed: 42
  output_dir: ${oc.env:COLLM_OUTPUT_DIR}/collm-stage2 #log and model saving path

  amp: True
  resume_ckpt_path: null

  evaluate: False # False: training, True: only evaluation
  train_splits: ["train"]
  valid_splits: ["valid"] # validation set
  test_splits: ["test","valid"] # used when evluate=True, reporting both the testing and validation results

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False